<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Table</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="table_styles.css">
    </head>
    <body>
        <table class="border-collapse border-2 border-gray-400 w-1/2 mx-auto my-auto">
            <thead>
                <tr>
                    <th class="border border-gray-300">Game</th>
                    <th class="border border-gray-300">genre</th>
                    <th class="border border-gray-300">price</th>
                    <th class="border border-gray-300">publisher</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th class="border border-gray-300">Fortnite</th>
                    <th class="border border-gray-300">Battle Royale</th>
                    <th class="border border-gray-300">Free</th>
                    <th class="border border-gray-300">Epic Games</th>
                </tr>
                <tr>
                    <th class="border border-gray-300">Minecraft</th>
                    <th class="border border-gray-300">action-adventure</th>
                    <th class="border border-gray-300">£29.99</th>
                    <th class="border border-gray-300">Mojang Studios</th>
                </tr>
                <tr>
                    <th class="border border-gray-300">Overwatch 2</th>
                    <th class="border border-gray-300">Hero Shooter</th>
                    <th class="border border-gray-300">Free</th>
                    <th class="border border-gray-300">Blizzard Entertainment</th>
                </tr>
                <tr>
                    <th class="border border-gray-300">Marvel Rivals</th>
                    <th class="border border-gray-300">Hero shooter</th>
                    <th class="border border-gray-300">Free</th>
                    <th class="border border-gray-300">NetEase Games</th>
                </tr>
                <tr>
                    <th class="border border-gray-300">Call of Duty: Black Ops 7</th>
                    <th class="border border-gray-300">Battle Royale</th>
                    <th class="border border-gray-300">£69.99</th>
                    <th class="border border-gray-300">Activision</th>
                </tr>
            </tbody>
        </table>
    </body>
</html>
