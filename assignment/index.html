<html lang="en">
<head>

    <body id="home-page" >
        <nav  id="nav">
            <div class="flex justify-center px-4 gap-4">
                <div class="hidden md:block" id="navbarNav pl-12">
                    <div class="flex justify-center">
                        <form id="search-form" class="mt-4 mb-4" onSubmit="searchShows(event)">
                            <input type="text" id="keywords" placeholder="Enter search here…" 
                            class="w-96 border border-gray-300 rounded-full px-2 py-1
                            text-sm text-black focus:outline-none">
                        </form>
                    </div>
                 
                    <ul class="flex justify-center  :flex-row gap-8 bg">
                        <li>
                            <a class="text-black hover:text-grey-600" href="index.html">Home</a>
                        </li>
                        <li>
                            <a class="text-black hover:text-grey-600" href="">row </a>
                        </li>
                        <li>
                            <a class="text-black hover:text-grey-600" href="">row </a>
                        </li>
                        <li>
                            <a class="text-black hover:text-grey-600" href="">row </a>
                        </li>
                    </ul>
                
                </div>
                    <button class="md:hidden items-center p-2 rounded text-gray-800 hover:bg-gray-200 ml-auto" onclick="this.nextElementSibling.classList.toggle('hidden')">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                </div>
            </div>
        </nav>
        <div class="grid grid-cols-6 w-full h-screen md:w-auto">
            <form class="hidden md:block flex-none" id="filters" action="">
                <div class="pl-4 py-4 flex flex-col gap-2">
                    <label for="showStatus">Show Status</label>
                    <select name="showStatus" id="showStatus" class="w-full max-w-[200px] h-[30px] border border-black">
                        
                    </select>
                </div>
                <div class="pl-4 py-4 flex flex-col gap-2">
                    <label for="showType">Show Type</label>
                    <select name="showType" id="showType" class="w-full max-w-[200px] h-[30px] border border-black">
                        
                    </select>
                </div>
                <div class="pl-4 py-4 flex flex-col gap-2">
                    <label for="genre">Genre</label>
                    <select name="genre" id="genre" class="w-full max-w-[200px] h-[30px] border border-black">
                        
                    </select>
                </div>
                <div class="pl-4 py-4 flex flex-col gap-2">
                    <label for="language">Language</label>
                    <select name="language" id="language" class="w-full max-w-[200px] h-[30px] border border-black">
                        
                    </select>
                </div>
                <div class="pl-4 py-4 flex flex-col gap-2">
                    <label for="country">Country</label>
                    <select name="country" id="country" class="w-full max-w-[200px] h-[30px] border border-black">
                        
                    </select>
                </div>
                <div class="pl-4 py-4 flex flex-col gap-2">
                    <label for="network">Network</label>
                    <select name="network" id="network" class="w-full max-w-[200px] h-[30px] border border-black">
                        
                    </select>
                </div>
                <div class="pl-4 py-4 flex flex-col gap-2">
                    <label for="webChannel">Web Channel</label>
                    <select name="webChannel" id="webChannel" class="w-full max-w-[200px] h-[30px] border border-black">
                        
                    </select>
                </div>
                <div class="pl-4 py-4 flex flex-col gap-2">
                    <label for="runtime">Runtime</label>
                    <select name="runtime" id="runtime" class="w-full max-w-[200px] h-[30px] border border-black">
                        
                    </select>
                </div>
                <div class="pl-4 py-4 flex flex-col gap-2">
                    <label for="rating">Rating</label>
                    <select name="rating" id="rating" class="w-full max-w-[200px] h-[30px] border border-black">
                        
                    </select>
                </div>
                <div class="pl-4 py-4 flex flex-col gap-2">
                    <label for="premieredSince">Premiered Since</label>
                    <select name="premieredSince" id="premieredSince" class="w-full max-w-[200px] h-[30px] border border-black">
                        
                    </select>
                </div>
                <div class="pl-4 py-4 flex flex-col gap-2">
                    <label for="premieredUntil">Premiered Until</label>
                    <select name="premieredUntil" id="premieredUntil" class="w-full max-w-[200px] h-[30px] border border-black">
                        
                    </select>
                </div>
                <div class="pl-4 py-4 flex flex-col gap-2">
                    <label for="sortBy">Sort By</label>
                    <select name="sortBy" id="sortBy" class="w-full max-w-[200px] h-[30px] border border-black">
                        
                    </select>
                </div>
                <button type="submit" class=" bg-blue-500 w-1/2 text-white ml-12 my-4 px-2 py-1 text-sm rounded hover:bg-blue-600">
                    Filter
                </button>
            </form>

            <div  class="col-span-6 md:w-auto md:col-span-4" id="grid-system">
                <div id="home_results" class="grid grid-cols-2 lg:grid-cols-4 gap-4 m-4 text-lg">
                </div>
                <div id="search_results" class="grid grid-cols-2 lg:grid-cols-4 gap-4 m-4 text-lg">
                </div>
                
                <button id="previousButton" class="bg-blue-500 w-[100px] text-white mb-4 px-2 py-1 text-sm rounded hover:bg-blue-600 float-left"><-- Previous</button>
                <button id="nextButton" class="bg-blue-500 w-[100px] text-white mb-4 px-2 py-1 text-sm rounded hover:bg-blue-600 float-right">Next --></button>
            </div>
            
            <div class="hidden md:block col-span-1 flex-none" >

            </div>
        </div>
    <script src="./js/index.js"></script>
    </body>
</html>
